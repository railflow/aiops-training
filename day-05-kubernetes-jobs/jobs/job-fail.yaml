# A Job that always fails, to show retries, backoffLimit, and the Failed condition.
apiVersion: batch/v1
kind: Job
metadata:
  name: always-fails
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120       # hard stop for the whole Job
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.36
          command: ["sh", "-c", "echo 'about to fail'; exit 1"]
