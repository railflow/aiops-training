# The "break it" variant: the SAME secret delivered as an ENVIRONMENT VARIABLE.
# Environment variables are fixed when the container starts, so a rotated password is NOT picked up.
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-py-env, namespace: apps, labels: {app: hello-py-env}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-py-env}}
  template:
    metadata: {labels: {app: hello-py-env}}
    spec:
      serviceAccountName: hello-app
      containers:
        - name: hello-py
          image: hello-py-app:1.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: PGHOST, value: postgres.data}
            - {name: PGDATABASE, value: app}
            - {name: PGUSER, value: app}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: password}}
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: hello-py-env, namespace: apps}
spec:
  selector: {app: hello-py-env}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: hello-py-env, namespace: apps}
spec:
  ingressClassName: traefik
  rules:
    - host: hello-py-env.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hello-py-env, port: {number: 80}}}
