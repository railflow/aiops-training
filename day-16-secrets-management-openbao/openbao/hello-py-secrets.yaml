# The Python API reading its database password from a FILE that is a mounted secret.
# Nothing in this manifest, the image, or the repository contains the password.
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-py-secrets, namespace: apps, labels: {app: hello-py-secrets}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-py-secrets}}
  template:
    metadata: {labels: {app: hello-py-secrets}}
    spec:
      serviceAccountName: hello-app
      containers:
        - name: hello-py
          image: hello-py-app:1.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: PGHOST, value: postgres.data}
            - {name: PGDATABASE, value: app}
            - {name: PGUSER, value: app}
            - {name: PGPASSWORD_FILE, value: /etc/db/password}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: db, mountPath: /etc/db, readOnly: true}
      volumes:
        - name: db
          secret: {secretName: db-credentials}
---
apiVersion: v1
kind: Service
metadata: {name: hello-py-secrets, namespace: apps}
spec:
  selector: {app: hello-py-secrets}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: hello-py-secrets, namespace: apps}
spec:
  ingressClassName: traefik
  rules:
    - host: hello-py-secrets.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hello-py-secrets, port: {number: 80}}}
