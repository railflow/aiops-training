# Namespace-level limits: a ResourceQuota caps the TOTAL a namespace may request; a LimitRange gives
# containers defaults and per-container bounds. Optional exercise.
apiVersion: v1
kind: Namespace
metadata: {name: quota-demo}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute, namespace: quota-demo}
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: quota-demo}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 200m, memory: 128Mi}
      max: {memory: 256Mi}
