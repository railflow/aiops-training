# Autoscaling demo: HorizontalPodAutoscaler needs metrics-server and a CPU REQUEST on the pods
# (utilisation is measured against the request). Drive it with k6:
#   k6 run -e BASE_URL=http://hpa.localhost:8080 -e TARGET_PATH='/burn?ms=30' -e MAX_VUS=20 load.js
apiVersion: apps/v1
kind: Deployment
metadata: {name: hpa-demo, namespace: apps, labels: {app: hpa-demo}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hpa-demo}}
  template:
    metadata: {labels: {app: hpa-demo}}
    spec:
      containers:
        - name: shop
          image: shop-observability:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: OTEL_SERVICE_NAME, value: hpa-demo}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: hpa-demo, namespace: apps}
spec:
  selector: {app: hpa-demo}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: hpa-demo, namespace: apps}
spec:
  ingressClassName: traefik
  rules:
    - host: hpa.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hpa-demo, port: {number: 80}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-demo, namespace: apps}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-demo}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}
