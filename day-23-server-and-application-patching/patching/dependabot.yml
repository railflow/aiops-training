# GitHub-hosted repositories only: goes to .github/dependabot.yml. On Forgejo use Renovate (renovate.json).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/app"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/app"
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
