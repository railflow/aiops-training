apiVersion: v1
kind: Namespace
metadata: {name: patch-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: patch-demo, namespace: patch-demo}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: patch-demo}}
  template:
    metadata: {labels: {app: patch-demo}}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: patch-demo}}
      containers:
        - name: app
          image: localhost:30500/patch-demo:1.0.0
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata: {name: patch-demo, namespace: patch-demo}
spec:
  selector: {app: patch-demo}
  ports: [{port: 80, targetPort: 8080}]
