apiVersion: apps/v1
kind: Deployment
metadata: {name: patch-demo, labels: {app: patch-demo}}
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  selector: {matchLabels: {app: patch-demo}}
  template:
    metadata: {labels: {app: patch-demo}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: localhost:30500/patch-demo:1.0.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
