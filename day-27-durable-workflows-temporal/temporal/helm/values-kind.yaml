# Temporal on the course's kind cluster, a SMALL install. Chart: temporal/temporal (version pinned in tools/versions.env).
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm install temporal temporal/temporal --version "$TEMPORAL_CHART_VERSION" -n temporal -f values-kind.yaml --wait --timeout 10m
# The chart bundles NO database: this file points it at the shared Postgres from Day 25 (namespace platform-data).
# Two roles and two databases must exist first (Secrets temporal-db and temporal-visibility-db in namespace temporal):
#   APP_NS=temporal ./platform db temporal              APP_NS=temporal ./platform db temporal-visibility
server:
  replicaCount: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  config:
    logLevel: "info"
    persistence:
      # IMPORTANT: this cannot be changed after the first install. 4 is for a laptop; the chart's default is 512
      # and production sizing is a capacity-planning decision (check the Temporal docs).
      numHistoryShards: 4
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "postgres.platform-data.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db
            secretKey: PGPASSWORD
            createDatabase: false
            manageSchema: true
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgres.platform-data.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal_visibility
            existingSecret: temporal-visibility-db
            secretKey: PGPASSWORD
            createDatabase: false
            manageSchema: true
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 1d
        - name: enterprise
          retention: 3d

web:
  enabled: true
  resources:
    requests: {cpu: 20m, memory: 64Mi}

admintools:
  enabled: true
