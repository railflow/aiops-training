# A SECOND and THIRD kind cluster, beside ai-ops-training. No host port mappings (8080/8443 are taken by ai-ops-training).
# Created with raw kind commands; the course's ./tools/kind wrapper only manages ai-ops-training and is unchanged.
#   kind create cluster --config kind-common.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: common
nodes:
  - role: control-plane
