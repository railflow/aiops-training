# Applied to the "common" cluster:  kubectl --context kind-common apply -f common-postgres.yaml
# A throwaway Postgres for the proof. The password is a demo value for a laptop-only database: real shared services use Secrets (Day 16).
apiVersion: v1
kind: Namespace
metadata: {name: shared}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: shared}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env: [{name: POSTGRES_PASSWORD, value: demo-only-not-a-secret}]
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "postgres"]}, periodSeconds: 5}
---
# A NodePort with a FIXED port is the simplest "front door" other clusters can reach: <node container IP>:30432.
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: shared}
spec:
  type: NodePort
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432, nodePort: 30432}]
