# Same protection with the pre-commit framework (https://pre-commit.com):
#   pip install pre-commit      (or: brew install pre-commit)
#   cp day-14-secrets-detection/secrets/pre-commit-config.yaml .pre-commit-config.yaml
#   pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
