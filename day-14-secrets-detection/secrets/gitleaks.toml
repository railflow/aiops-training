# Project gitleaks configuration (use with: gitleaks detect --config gitleaks.toml).
title = "course gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented example values and course documentation"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]
paths = [
  '''docs/.*''',
]
