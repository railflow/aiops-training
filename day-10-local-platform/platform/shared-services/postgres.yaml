# ONE Postgres for many small apps. Each app gets its own database and role (bin/provision-db.sh).
# Learning setup: a single replica, no backups, no failover. Production: an operator (CloudNativePG) or a managed service.
# The admin Secret `postgres-admin` (key POSTGRES_PASSWORD) is created by bin/create-secrets.sh, never committed.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: platform-data}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: pg, containerPort: 5432}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-admin, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 20, failureThreshold: 6}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: platform-data}
spec:
  selector: {app: postgres}
  ports: [{name: pg, port: 5432, targetPort: pg}]
