# Sonatype Nexus Repository Community Edition: one registry for images, Maven artifacts and Python packages.
# Needs roughly 2 to 3 GB of memory. Pin the image tag you actually use in tools/versions.env.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nexus-data, namespace: platform}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nexus, namespace: platform, labels: {app: nexus}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: nexus}}
  template:
    metadata: {labels: {app: nexus}}
    spec:
      securityContext: {fsGroup: 200}
      containers:
        - name: nexus
          image: sonatype/nexus3:latest
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g"
          ports:
            - {name: ui, containerPort: 8081}
            - {name: docker, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /service/rest/v1/status, port: 8081}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 250m, memory: 1536Mi}
            limits: {memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /nexus-data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: nexus-data}
---
apiVersion: v1
kind: Service
metadata: {name: nexus, namespace: platform}
spec:
  type: NodePort
  selector: {app: nexus}
  ports:
    - {name: ui, port: 8081, targetPort: 8081, nodePort: 30081}
    - {name: docker, port: 5000, targetPort: 5000, nodePort: 30500}
