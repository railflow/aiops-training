# Flagger and its load tester, installed by Flux's helm-controller (so even the tools are in git).
# Chart versions are pinned. meshProvider=traefik makes Flagger drive Traefik weighted routing (TraefikService).
# prometheus.install=true runs the small Prometheus bundled with the chart: it scrapes Traefik's metrics, which is
# where the built-in request-success-rate and request-duration checks read from. That bundled Prometheus image is old
# (v2.41.0 when rendered on 2026-11-05): a real patching item, see the patching days.
apiVersion: v1
kind: Namespace
metadata: {name: flagger-system}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: flagger, namespace: flagger-system}
spec:
  interval: 1h
  url: https://flagger.app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: flagger, namespace: flagger-system}
spec:
  interval: 10m
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef: {kind: HelmRepository, name: flagger}
  values:
    meshProvider: traefik
    metricsServer: http://flagger-prometheus:9090
    prometheus:
      install: true
---
apiVersion: v1
kind: Namespace
metadata: {name: podinfo}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: flagger-loadtester, namespace: podinfo}
spec:
  interval: 10m
  dependsOn: [{name: flagger, namespace: flagger-system}]
  chart:
    spec:
      chart: loadtester
      version: "0.39.0"
      sourceRef: {kind: HelmRepository, name: flagger, namespace: flagger-system}
