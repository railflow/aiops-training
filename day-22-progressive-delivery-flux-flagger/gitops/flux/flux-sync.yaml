# Tells Flux which Git repository to watch and which folder to apply. Apply once by hand; everything else comes from git.
# The URL is the in-cluster name of Forgejo (Day 10), repository "hello-config" owned by user "student".
# Plain HTTP Git remotes: check the Flux documentation for your version; if Flux refuses http://, use a Git server with TLS,
# an SSH deploy key, or an OCIRepository pointing at the registry.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: hello-config, namespace: flux-system}
spec:
  interval: 1m
  url: http://forgejo.platform.svc.cluster.local:3000/student/hello-config.git
  ref: {branch: main}
  secretRef: {name: forgejo-auth}      # username + password (or token) Secret, created from the command line
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: infrastructure, namespace: flux-system}
spec:
  interval: 5m
  sourceRef: {kind: GitRepository, name: hello-config}
  path: ./infrastructure
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: apps, namespace: flux-system}
spec:
  interval: 1m
  dependsOn: [{name: infrastructure}]
  sourceRef: {kind: GitRepository, name: hello-config}
  path: ./apps/podinfo
  prune: true
  timeout: 3m
