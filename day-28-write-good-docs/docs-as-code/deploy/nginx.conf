# Static docs site. Runs as the non-root nginx user (101) on 8080 with a read-only root filesystem:
# the pid file and all temp paths live in /tmp (mount an emptyDir there). Logs are JSON on stdout for the collector.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent","request_id":"$request_id"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A strict Content-Security-Policy needs testing against the site's inline scripts (Starlight, Mermaid): check the docs before enabling one.

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Hashed build assets never change: cache them hard. HTML must revalidate.
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }

    error_page 404 /404.html;
  }
}
