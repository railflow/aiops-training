# Three REST apps in namespace "apps", each a plain ClusterIP Service on port 80.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-py, namespace: apps, labels: {app: hello-py}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-py}}
  template:
    metadata: {labels: {app: hello-py}}
    spec:
      containers:
        - name: hello-py
          image: hello-py-app:1.1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: hello-py, namespace: apps}
spec:
  selector: {app: hello-py}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-java, namespace: apps, labels: {app: hello-java}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-java}}
  template:
    metadata: {labels: {app: hello-java}}
    spec:
      containers:
        - name: hello-java
          image: hello-java-app:1.1
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "/app/app.jar", "com.example.Api"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: hello-java, namespace: apps}
spec:
  selector: {app: hello-java}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-go, namespace: apps, labels: {app: hello-go}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-go}}
  template:
    metadata: {labels: {app: hello-go}}
    spec:
      containers:
        - name: hello-go
          image: hello-go-api:1.0
          imagePullPolicy: IfNotPresent
          env: [{name: APP_VERSION, value: v1}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: hello-go, namespace: apps}
spec:
  selector: {app: hello-go}
  ports: [{name: http, port: 80, targetPort: 8080}]
