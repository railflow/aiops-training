# (d) Weighted routing between two versions of the Go app: 80% v1, 20% v2.
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-go-v1, namespace: apps, labels: {app: hello-go, version: v1}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-go, version: v1}}
  template:
    metadata: {labels: {app: hello-go, version: v1}}
    spec:
      containers:
        - name: hello-go
          image: hello-go-api:1.0
          imagePullPolicy: IfNotPresent
          env: [{name: APP_VERSION, value: v1}]
          ports: [{containerPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-go-v2, namespace: apps, labels: {app: hello-go, version: v2}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hello-go, version: v2}}
  template:
    metadata: {labels: {app: hello-go, version: v2}}
    spec:
      containers:
        - name: hello-go
          image: hello-go-api:1.0
          imagePullPolicy: IfNotPresent
          env: [{name: APP_VERSION, value: v2}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: hello-go-v1, namespace: apps}
spec:
  selector: {app: hello-go, version: v1}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: hello-go-v2, namespace: apps}
spec:
  selector: {app: hello-go, version: v2}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: hello-go-weighted
  namespace: apps
spec:
  weighted:
    services:
      - name: hello-go-v1
        port: 80
        weight: 80
      - name: hello-go-v2
        port: 80
        weight: 20
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-go-weighted
  namespace: apps
spec:
  entryPoints: [web]
  routes:
    - match: Host(`canary.localhost`)
      kind: Rule
      services:
        - name: hello-go-weighted
          kind: TraefikService
