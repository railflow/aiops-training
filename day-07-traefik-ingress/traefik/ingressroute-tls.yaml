# TLS with a local certificate. Create the secret first (see the lesson, mkcert section):
#   kubectl -n apps create secret tls hello-py-tls --cert=hello-py.localhost.pem --key=hello-py.localhost-key.pem
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-py-tls
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`hello-py.localhost`)
      kind: Rule
      services:
        - name: hello-py
          port: 80
  tls:
    secretName: hello-py-tls
---
# Redirect plain HTTP for this host to HTTPS.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-py-http-redirect
  namespace: apps
spec:
  entryPoints: [web]
  routes:
    - match: Host(`hello-py.localhost`)
      kind: Rule
      middlewares:
        - name: https-redirect
      services:
        - name: hello-py
          port: 80
