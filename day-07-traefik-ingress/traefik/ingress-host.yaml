# (a1) Standard Kubernetes Ingress, host-based routing. ingressClassName selects Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-hosts
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: hello-py.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hello-py, port: {number: 80}}}
    - host: hello-java.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hello-java, port: {number: 80}}}
    - host: hello-go.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hello-go, port: {number: 80}}}
