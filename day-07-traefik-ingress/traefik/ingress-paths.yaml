# (a2) Standard Kubernetes Ingress, path-based routing on ONE hostname.
# Without stripping the prefix, an app sees /py or /go as its own path:
# the Go app echoes any path, the Python app returns 404 for /py.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-paths
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: apps.localhost
      http:
        paths:
          - path: /py
            pathType: Prefix
            backend: {service: {name: hello-py, port: {number: 80}}}
          - path: /go
            pathType: Prefix
            backend: {service: {name: hello-go, port: {number: 80}}}
