# Protect the Java API with basic auth.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-java-secure
  namespace: apps
spec:
  entryPoints: [web]
  routes:
    - match: Host(`secure.localhost`)
      kind: Rule
      middlewares:
        - name: basic-auth
      services:
        - name: hello-java
          port: 80
