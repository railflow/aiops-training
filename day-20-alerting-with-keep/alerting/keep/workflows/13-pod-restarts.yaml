# Generated from queries/04-pod-restarts-15m.sql. Compare the SQL to keep the two in sync.
# Pattern: run a query every 60 seconds; if the condition holds create a firing alert, otherwise a
# resolved alert with the same fingerprint (name + service), so Keep keeps one alert and updates its status.
workflow:
  id: alert-pod-restarts
  name: "Alert: container restarts in the last 15 minutes"
  description: "Runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/pod-restarts.md"
  triggers:
    - type: manual
    - type: interval
      value: 60
  steps:
    - name: query
      provider:
        type: clickhouse
        config: "{{ providers.clickhouse-otel }}"
        with:
          query: |
            SELECT count() AS containers_restarting,
                   sum(restarts) AS restarts,
                   arrayStringConcat(groupArray(concat(namespace, '/', pod)), ', ') AS pods
            FROM (
              SELECT ResourceAttributes['k8s.namespace.name'] AS namespace,
                     ResourceAttributes['k8s.pod.name'] AS pod,
                     max(Value) - min(Value) AS restarts
              FROM otel.otel_metrics_gauge
              WHERE MetricName = 'k8s.container.restarts' AND TimeUnix > now() - INTERVAL 15 MINUTE
                AND ResourceAttributes['k8s.namespace.name'] = 'apps'
              GROUP BY namespace, pod, ResourceAttributes['k8s.container.name']
              HAVING restarts > 0
            );
          single_row: "True"
  actions:
    - name: fire
      if: "{{ steps.query.results.containers_restarting }} > 0"
      provider:
        type: keep
        with:
          override_source_with: clickhouse
          fingerprint_fields:
            - name
            - service
          alert:
            name: "Containers restarting in namespace apps"
            status: firing
            severity: warning
            service: apps
            description: '{{ steps.query.results.restarts }} restart(s) in 15 minutes: {{ steps.query.results.pods }}'
            labels:
              service: apps
              cluster: ai-ops-training
              team: shop
              runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/pod-restarts.md
    - name: resolve
      if: "{{ steps.query.results.containers_restarting }} == 0"
      provider:
        type: keep
        with:
          override_source_with: clickhouse
          fingerprint_fields:
            - name
            - service
          alert:
            name: "Containers restarting in namespace apps"
            status: resolved
            severity: warning
            service: apps
            description: 'No container restarts in the last 15 minutes.'
            labels:
              service: apps
              cluster: ai-ops-training
              team: shop
              runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/pod-restarts.md
