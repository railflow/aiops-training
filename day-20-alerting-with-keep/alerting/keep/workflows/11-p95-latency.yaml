# Generated from queries/02-p95-latency-5m.sql. Compare the SQL to keep the two in sync.
# Pattern: run a query every 60 seconds; if the condition holds create a firing alert, otherwise a
# resolved alert with the same fingerprint (name + service), so Keep keeps one alert and updates its status.
workflow:
  id: alert-checkout-latency
  name: "Alert: checkout p95 above 300 ms (5 minute window)"
  description: "Runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/slow-requests.md"
  triggers:
    - type: manual
    - type: interval
      value: 60
  steps:
    - name: query
      provider:
        type: clickhouse
        config: "{{ providers.clickhouse-otel }}"
        with:
          query: |
            SELECT 'shop-frontend' AS service,
                   count() AS requests,
                   if(count() < 20, 0, round(quantile(0.95)(Duration) / 1e6, 1)) AS p95_ms
            FROM otel.otel_traces
            WHERE Timestamp > now() - INTERVAL 5 MINUTE
              AND SpanKind IN ('Server', 'SPAN_KIND_SERVER')
              AND ServiceName = 'shop-frontend'
              AND SpanName LIKE '%/checkout%';
          single_row: "True"
  actions:
    - name: fire
      if: "{{ steps.query.results.p95_ms }} > 300"
      provider:
        type: keep
        with:
          override_source_with: clickhouse
          fingerprint_fields:
            - name
            - service
          alert:
            name: "Slow checkout on shop-frontend"
            status: firing
            severity: warning
            service: shop-frontend
            description: 'p95 latency of /checkout is {{ steps.query.results.p95_ms }} ms over the last 5 minutes (threshold 300 ms).'
            labels:
              service: shop-frontend
              cluster: ai-ops-training
              team: shop
              runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/slow-requests.md
    - name: resolve
      if: "{{ steps.query.results.p95_ms }} <= 300"
      provider:
        type: keep
        with:
          override_source_with: clickhouse
          fingerprint_fields:
            - name
            - service
          alert:
            name: "Slow checkout on shop-frontend"
            status: resolved
            severity: warning
            service: shop-frontend
            description: 'Checkout p95 latency is back under 300 ms.'
            labels:
              service: shop-frontend
              cluster: ai-ops-training
              team: shop
              runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/slow-requests.md
