# Generated from queries/01-error-rate-5m.sql. Compare the SQL to keep the two in sync.
# Pattern: run a query every 60 seconds; if the condition holds create a firing alert, otherwise a
# resolved alert with the same fingerprint (name + service), so Keep keeps one alert and updates its status.
workflow:
  id: alert-error-rate
  name: "Alert: error rate above 5% (5 minute window)"
  description: "Runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/high-error-rate.md"
  triggers:
    - type: manual
    - type: interval
      value: 60
  steps:
    - name: query
      provider:
        type: clickhouse
        config: "{{ providers.clickhouse-otel }}"
        with:
          query: |
            SELECT 'shop-frontend' AS service,
                   count() AS requests,
                   if(count() < 20, 0, round(100 * countIf(StatusCode IN ('Error', 'STATUS_CODE_ERROR')) / count(), 2)) AS error_pct
            FROM otel.otel_traces
            WHERE Timestamp > now() - INTERVAL 5 MINUTE
              AND SpanKind IN ('Server', 'SPAN_KIND_SERVER')
              AND ServiceName = 'shop-frontend';
          single_row: "True"
  actions:
    - name: fire
      if: "{{ steps.query.results.error_pct }} > 5"
      provider:
        type: keep
        with:
          override_source_with: clickhouse
          fingerprint_fields:
            - name
            - service
          alert:
            name: "High error rate on shop-frontend"
            status: firing
            severity: critical
            service: shop-frontend
            description: '{{ steps.query.results.error_pct }}% of the last {{ steps.query.results.requests }} user requests to shop-frontend failed in the last 5 minutes (threshold 5%).'
            labels:
              service: shop-frontend
              cluster: ai-ops-training
              team: shop
              runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/high-error-rate.md
    - name: resolve
      if: "{{ steps.query.results.error_pct }} <= 5"
      provider:
        type: keep
        with:
          override_source_with: clickhouse
          fingerprint_fields:
            - name
            - service
          alert:
            name: "High error rate on shop-frontend"
            status: resolved
            severity: critical
            service: shop-frontend
            description: 'Error rate is back at or below 5%.'
            labels:
              service: shop-frontend
              cluster: ai-ops-training
              team: shop
              runbook: https://github.com/railflow/aiops-training/blob/main/day-20-alerting-with-keep/alerting/runbooks/high-error-rate.md
