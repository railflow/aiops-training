# Keep (open-source alert management) on kind, behind Traefik at http://keep.localhost:8080.
# Chart: keephq/keep (helm repo add keephq https://keephq.github.io/helm-charts). Compare with:
#   helm show values keephq/keep --version 0.1.97 | less
# Secrets are NOT in this file. Create them first (see the lesson):
#   keep-auth       AUTH_TYPE, KEEP_JWT_SECRET, KEEP_DEFAULT_USERNAME, KEEP_DEFAULT_PASSWORD, KEEP_DEFAULT_API_KEYS
#   keep-providers  KEEP_PROVIDERS (JSON that includes the ClickHouse password)
#   keep-ui         AUTH_TYPE, NEXTAUTH_SECRET
# Workflows are provisioned from the ConfigMap keep-workflow-files (kubectl apply -k keep/).
#
# Why frontend.env and a KEEP_API_URL are set by hand: the chart builds NEXTAUTH_URL and KEEP_API_URL
# from the ingress host name ("http://keep.localhost") and does not know that kind publishes Traefik
# on host port 8080. Without the port, the login redirect goes to port 80 and fails.
global:
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: keep.localhost

backend:
  envFromSecrets:
    - name: keep-auth
    - name: keep-providers
  extraVolumes:
    - name: workflow-files
      configMap:
        name: keep-workflow-files
  extraVolumeMounts:
    - name: workflow-files
      mountPath: /workflows
      readOnly: true
  env:
    - {name: KEEP_API_URL, value: "http://keep.localhost:8080/v2"}
    - {name: KEEP_WORKFLOWS_DIRECTORY, value: /workflows}
    - {name: DATABASE_CONNECTION_STRING, value: "mysql+pymysql://root@keep-database:3306/keep"}
    - {name: DATABASE_NAME, value: keep-database}
    - {name: SECRET_MANAGER_TYPE, value: k8s}
    - {name: PORT, value: "8080"}
    - {name: PUSHER_APP_ID, value: "1"}
    - {name: PUSHER_APP_KEY, value: keepappkey}
    - {name: PUSHER_APP_SECRET, value: keepappsecret}
    - {name: PUSHER_HOST, value: keep-websocket}
    - {name: PUSHER_PORT, value: "6001"}
    - {name: PROMETHEUS_MULTIPROC_DIR, value: "/tmp/prometheus"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

frontend:
  envFromSecrets:
    - name: keep-ui
  env:
    - {name: NEXTAUTH_URL, value: "http://keep.localhost:8080"}
    - {name: VERCEL, value: "1"}
    - {name: ENV, value: development}
    - {name: NODE_ENV, value: development}
    - {name: HOSTNAME, value: "0.0.0.0"}
    - {name: PUSHER_APP_KEY, value: keepappkey}
    - {name: FRIGADE_DISABLED, value: "true"}
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

websocket:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

# The chart's default database is MySQL "latest" (a floating tag). Pin it; this is also an example of
# why the Container patching day says never to rely on :latest.
database:
  mysql:
    image:
      repository: mysql
      tag: "8.4"
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1Gi}
