# A toolbox pod with curl, dig, tcpdump, and more. Created in the namespace you choose:
#   kubectl apply -n frontend -f netshoot.yaml
#   kubectl apply -n intruder -f netshoot.yaml
apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  labels:
    app: netshoot
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
