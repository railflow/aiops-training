# The "frontend": the Python REST API in namespace frontend. /relay calls the Java API.
# Also exposed on NodePort 30090, which kind-config.yaml maps to http://localhost:30090 on your laptop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: frontend
  labels:
    app: python-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      containers:
        - name: python-api
          image: hello-py-app:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_API_URL
              value: http://java-api.backend
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: python-api
  namespace: frontend
spec:
  type: NodePort
  selector:
    app: python-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30090
